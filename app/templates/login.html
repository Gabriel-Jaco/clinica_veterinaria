<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Clínica Veterinária</title>
        <style>
            :root {
                --primary-color: #0d9488; /* Verde-água profissional */
                --primary-hover: #0f766e;
                --bg-color: #f0fdf4; /* Tom levemente esverdeado e suave */
                --card-bg: #ffffff;
                --text-color: #1f2937;
                --border-color: #d1d5db;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .login-card {
                background: var(--card-bg);
                padding: 2.5rem;
                border-radius: 1rem;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
                width: 100%;
                max-width: 400px;
                text-align: center;
                border-top: 5px solid var(--primary-color);
            }

            h1 {
                margin-top: 0;
                color: var(--text-color);
                font-size: 1.75rem;
                margin-bottom: 0.25rem;
            }

            .subtitle {
                color: #6b7280;
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }

            /* Estilização para os parágrafos gerados pelo {{ form.as_p }} do Django */
            form p {
                margin-bottom: 1.25rem;
                text-align: left;
            }

            form label {
                display: block;
                font-weight: 600;
                margin-bottom: 0.35rem;
                color: var(--text-color);
                font-size: 0.9rem;
            }

            form input {
                width: 100%;
                padding: 0.75rem;
                border: 1px solid var(--border-color);
                border-radius: 0.5rem;
                font-size: 1rem;
                box-sizing: border-box;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            form input:focus {
                outline: none;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
            }

            /* Estilização de mensagens de erro globais ou de campo do Django se houver */
            .errorlist {
                color: #e11d48;
                font-size: 0.85rem;
                padding-left: 0;
                list-style: none;
                margin: 0.25rem 0 0 0;
            }

            button[type="submit"] {
                display: block;
                width: 100%;
                padding: 0.75rem 1rem;
                border-radius: 0.5rem;
                font-size: 1rem;
                font-weight: 600;
                text-decoration: none;
                cursor: pointer;
                border: none;
                background-color: var(--primary-color);
                color: white;
                transition: background-color 0.2s, transform 0.1s;
                box-sizing: border-box;
                margin-top: 1.5rem;
            }

            button[type="submit"]:hover {
                background-color: var(--primary-hover);
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <h1>🐾 VetSystem</h1>
            <p class="subtitle">Faça login para acessar o sistema</p>
            
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Entrar</button>
            </form>
        </div>
    </body>
</html>
