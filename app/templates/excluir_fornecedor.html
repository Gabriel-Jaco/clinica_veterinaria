<style>
    :root {
        --primary-color: #0d9488;
        --primary-hover: #0f766e;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
    }

    .fornecedor-container {
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        padding: 2rem;
        color: var(--text-color);
    }

    .header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .header-nav h1 {
        font-size: 2rem;
        margin: 0;
    }

    .delete-card {
        background: white;
        border-radius: 1rem;
        padding: 3rem 2rem;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,.05);
        border-top: 5px solid #dc2626;
    }

    .delete-icon {
        font-size: 3.5rem;
        color: #dc2626;
        margin-bottom: 1rem;
    }

    .delete-card h2 {
        margin-bottom: 1rem;
    }

    .delete-card p {
        color: #64748b;
    }

    .btn-excluir {
        background: #dc2626;
        color: white;
        border: none;
        padding: .7rem 1.2rem;
        border-radius: .5rem;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-excluir:hover {
        background: #b91c1c;
    }

    .btn-voltar {
        display: inline-block;
        background: white;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        padding: .6rem 1rem;
        border-radius: .5rem;
        text-decoration: none;
        font-weight: 600;
    }

    .botoes {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 2rem;
    }

    @media(max-width: 600px) {
        .fornecedor-container {
            padding: 1rem;
        }
    }
</style>

<div class="fornecedor-container">

    <div class="header-nav">
        <h1>🗑️ Excluir Fornecedor</h1>

        <a href="{% url 'fornecedor' %}" class="btn-voltar">
            ← Voltar
        </a>
    </div>

    <div class="delete-card">

        <div class="delete-icon">⚠️</div>

        <h2>Tem certeza?</h2>

        <p>
            Você está prestes a excluir o fornecedor:
        </p>

        <h4>{{ fornecedor.nome }}</h4>

        <p>
            Essa ação não poderá ser desfeita.
        </p>

        <p>
            Caso existam lotes vinculados a este fornecedor,
            a exclusão será impedida pelo sistema.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="botoes">
                <a href="{% url 'fornecedor' %}" class="btn-voltar">
                    Cancelar
                </a>

                <button type="submit" class="btn-excluir">
                    Confirmar Exclusão
                </button>
            </div>
        </form>

    </div>
</div>
