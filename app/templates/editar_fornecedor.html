

<style>
    :root {
        --primary-color: #0d9488;
        --primary-hover: #0f766e;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
    }

    .fornecedor-container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
        color: var(--text-color);
    }

    .header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .header-nav h1 {
        font-size: 2rem;
        margin: 0;
    }

    .form-card {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,.05);
        border-top: 5px solid var(--primary-color);
    }

    .form-fornecedor label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-fornecedor input,
    .form-fornecedor select,
    .form-fornecedor textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: .5rem;
        box-sizing: border-box;
        font-size: 1rem;
    }

    .form-fornecedor input:focus,
    .form-fornecedor select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(13,148,136,.12);
    }

    .campo {
        margin-bottom: 1.3rem;
    }

    .btn-fornecedor {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: .7rem 1.2rem;
        border-radius: .5rem;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-fornecedor:hover {
        background: var(--primary-hover);
    }

    .btn-voltar {
        display: inline-block;
        background: white;
        color: var(--primary-color);
        border: 2px solid var(--primary-color);
        padding: .6rem 1rem;
        border-radius: .5rem;
        font-weight: 600;
        text-decoration: none;
    }

    .erro {
        color: #dc2626;
        font-size: .85rem;
        margin-top: 5px;
    }

    .botoes {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 1.5rem;
    }

    @media(max-width: 600px) {
        .fornecedor-container {
            padding: 1rem;
        }
    }
</style>

<div class="fornecedor-container">

    <div class="header-nav">
        <h1>✏️ Editar Fornecedor</h1>

        <a href="{% url 'fornecedor' %}" class="btn-voltar">
            ← Voltar
        </a>
    </div>

    <div class="form-card">

        <form method="POST" class="form-fornecedor">
            {% csrf_token %}

            {% for field in form %}
                <div class="campo">
                    <label>{{ field.label }}</label>
                    {{ field }}

                    {% if field.errors %}
                        <div class="erro">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="botoes">
                <a href="{% url 'fornecedor' %}" class="btn-voltar">
                    Cancelar
                </a>

                <button type="submit" class="btn-fornecedor">
                    Salvar Alterações
                </button>
            </div>

        </form>

    </div>
</div>
