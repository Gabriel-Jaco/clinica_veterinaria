<div class="field {{ cls }}{% if field.errors %} field--invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    <div class="control control--icon control--password" data-password>
        {% include "partials/icon.html" with n="lock" %}
        {{ field }}
        <button type="button" class="reveal" hidden aria-pressed="false" aria-label="Mostrar senha">{% include "partials/icon.html" with n="eye" %}</button>
    </div>
    {% if hint %}<p class="hint">{{ hint }}</p>{% endif %}
    {% for error in field.errors %}<p class="error">{% include "partials/icon.html" with n="circle-alert" %}<span>{{ error }}</span></p>{% endfor %}
</div>
