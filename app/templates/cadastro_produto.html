
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0fdf4;
            color: #1f2937;
            padding: 2rem;
            margin: 0;
        }

        .container { max-width: 700px; margin: auto; }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            border-top: 5px solid #0d9488;
            box-shadow: 0 2px 8px #00000010;
        }

        .campo { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #0d9488;
            border-color: transparent;
        }

        .erro { color: #dc2626; font-size: 13px; margin-top: 5px; }

        .aviso {
            background: #f0fdf4;
            padding: 12px;
            border-radius: 6px;
            color: #0f766e;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .botoes { display: flex; gap: 10px; margin-top: 20px; }

        .btn {
            padding: 11px 18px;
            border: 1px solid #0d9488;
            border-radius: 6px;
            background: #0d9488;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover { background: #0f766e; }

        .btn-voltar { background: white; color: #0d9488; }

        .btn-voltar:hover { color: white; }

        h1 { margin: 0; font-size: 25px; }
    </style>
</head>

<body>
    <div class="container">

        <div class="header-nav">
            <h1>Cadastrar Produto</h1>
            <a href="{% url 'produto' %}" class="btn btn-voltar">Voltar</a>
        </div>

        <div class="card">

            <div class="aviso">
                O estoque será calculado automaticamente com base nos lotes cadastrados.
            </div>

            <form method="POST">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="erro">{{ form.non_field_errors }}</div>
                {% endif %}

                {% for field in form %}
                    <div class="campo">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}

                        {% if field.errors %}
                            <div class="erro">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="botoes">
                    <button type="submit" class="btn">Cadastrar</button>
                    <a href="{% url 'produto' %}" class="btn btn-voltar">Cancelar</a>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
